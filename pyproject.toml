[project]
name = "flightlabfoam"
version = "0.1.0"
description = "Local web app that designs wing panels and writes G-code for a 4-axis hot-wire foam cutter."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "numpy>=2.2.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
flightlabfoam = "flightlabfoam.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flightlabfoam"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
