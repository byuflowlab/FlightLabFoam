[project]
name = "flightlabfoam"
version = "0.1.0"
description = "Local web app that designs wing panels and writes G-code for a 4-axis hot-wire foam cutter."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "numpy>=2.2.6",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Exact versions of every library for the student launchers, which install
# flightlabfoam[pinned]. See student_setup/README.md.
pinned = [
    # BEGIN PINS (generated by student_setup/update_pins.py; do not edit by hand)
    "blinker==1.9.0",  # via flask
    "click==8.5.0",  # via flask
    "flask==3.1.3",  # via flightlabfoam (pyproject.toml)
    "itsdangerous==2.2.0",  # via flask
    "jinja2==3.1.6",  # via flask
    "markupsafe==3.0.4",  # via flask, jinja2, werkzeug
    "numpy==2.5.4",  # via flightlabfoam (pyproject.toml)
    "pyyaml==6.0.3",  # via flightlabfoam (pyproject.toml)
    "werkzeug==3.1.9",  # via flask
    # END PINS
]

[project.scripts]
flightlabfoam = "flightlabfoam.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flightlabfoam"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
